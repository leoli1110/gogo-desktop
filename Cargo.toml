[workspace]
resolver = "2"
members = ["crates/gogo-index", "crates/gogo-discovery", "crates/gogo-auth", "crates/gogo-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Leo Li"]
repository = "https://github.com/leoli1110/gogo-desktop"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
parking_lot = "0.12"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
