[package]
name = "gogo-server"
description = "Gogo Desktop server: web interface, API and indexing service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "gogo"
path = "src/main.rs"

[dependencies]
gogo-index = { path = "../gogo-index" }
gogo-discovery = { path = "../gogo-discovery" }
gogo-auth = { path = "../gogo-auth" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
tower = { version = "0.5", features = ["util"] }
rust-embed = "8"
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
serde_yaml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha2 = "0.10"
hex = "0.4"
data-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_Memory",
] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
